# Render Blueprint for NYU LIMS (portfolio demo)
# Creates: nyulims-api (FastAPI backend) and nyulims-web (React static site)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nyulims-api
    runtime: python
    plan: starter            # paid "Starter" instance ($7/mo): never sleeps, no cold starts
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./nyu_lims.db   # demo DB, re-seeded with sample data on each deploy
      - key: DEMO_SEED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: ADMIN_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: SYSTEM_PASSWORD
        sync: false          # the password reviewers use on the login page
      - key: CORS_ORIGINS
        sync: false          # e.g. https://nyulims-web.onrender.com

  - type: web
    name: nyulims-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # e.g. https://nyulims-api.onrender.com/api/v1
      - key: VITE_DEMO_PASSWORD
        sync: false          # same value as SYSTEM_PASSWORD, shown on the login page
